<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Don't Be Late – Settings</title>
    <link rel="icon" href="icons/icon32.png" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Don't Be Late</h1>
      <section>
        <h2>Google accounts</h2>
        <p class="hint">Meetings from the calendars of these accounts open automatically shortly before they start.</p>
        <ul id="accounts"></ul>
        <p id="no-accounts" class="hint" hidden>No accounts connected yet.</p>
        <button id="connect" type="button">Connect a Google account</button>
        <p id="error" class="error" role="alert" hidden></p>
      </section>
      <section>
        <h2>Behavior</h2>
        <p>
          <label>
            Open meetings
            <input id="lead-minutes" type="number" min="0" max="10" step="1" required />
            minute(s) before they start
          </label>
        </p>
        <p id="pause-status" class="status"></p>
        <p class="buttons">
          <button id="pause-hour" type="button">Pause for 1 hour</button>
          <button id="pause-day" type="button">Pause until tomorrow</button>
          <button id="resume" type="button">Resume</button>
        </p>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
